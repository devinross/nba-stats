<!doctype html>
<!--
  Source artwork for public/og.png (the 1200x630 social share card).
  Rendered to PNG by `npm run og` (scripts/build-og.mjs) via headless Chrome —
  edit this file, re-run that, and commit the new PNG.

  Deliberately plum-on-white in the brand's own type, so a link to this site in
  a message or a tweet looks like the rest of Highlight Factory.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #ffffff;
        font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
        color: #000000;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
      }
      /* A slab of brand plum bleeding off the right edge, echoing the app's
         intro card gradient. */
      .wash {
        position: absolute;
        right: -180px;
        top: -180px;
        width: 720px;
        height: 990px;
        background: linear-gradient(150deg, #3a1136, #b0507e);
        transform: rotate(-12deg);
        opacity: 0.10;
      }
      .brand { display: flex; align-items: center; gap: 16px; }
      .brand span {
        font-size: 30px; font-weight: 600; letter-spacing: -0.01em;
      }
      h1 {
        font-size: 92px; font-weight: 700; line-height: 1.02;
        letter-spacing: -0.045em;
      }
      .accent { color: #3a1136; }
      .sub {
        margin-top: 24px; font-size: 27px; font-weight: 400;
        color: #737373; line-height: 1.45; max-width: 900px;
      }
      .chips { display: flex; gap: 12px; flex-wrap: wrap; }
      .chip {
        border: 1px solid #e2e2e2; border-radius: 999px;
        padding: 12px 22px; font-size: 21px; font-weight: 600; color: #3a1136;
      }
    </style>
  </head>
  <body>
    <div class="wash"></div>
